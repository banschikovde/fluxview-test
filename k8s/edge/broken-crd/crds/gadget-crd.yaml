# A CRD file whose YAML cannot be decoded (the unclosed "[" under
# versions): a schema source the user pointed validate at must not break
# silently — the conversion fails the whole run (exit 2, "could not
# decode a document"), symmetric with the corrupt JSON schema file in
# ../broken-schema/, and the failure is never cached: a warm cache errors
# identically until the file is fixed.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: gadgets.noschema.example.com
spec:
  group: noschema.example.com
  names:
    kind: Gadget
    plural: gadgets
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
      broken syntax: unclosed bracket: [
