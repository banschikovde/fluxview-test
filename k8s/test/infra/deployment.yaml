apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
    helm.sh/chart: backend-0.1.0
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: nginx:1.25
          ports:
            - containerPort: 8080
status:
  observedGeneration: 1
  readyReplicas: 1
