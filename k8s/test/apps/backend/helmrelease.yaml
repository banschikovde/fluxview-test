apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: backend
  namespace: backend
spec:
  interval: 5m
  chart:
    spec:
      chart: ./k8s/test/apps/backend/chart
      version: "0.1.0"
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  values:
    replicaCount: 2
    image:
      repository: nginx
      tag: "1.25"
